version: '3.8'

services:
  web:
    build: .
    container_name: backend_app
    restart: always
    environment:
      - ENV=production
    expose:
      - "5000"

  proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web